name: build-ipa

on:
  workflow_dispatch:
  push:
    paths:
      - 'App/**'
      - 'Shared/**'
      - 'BroadcastExtension/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -e
          xcodebuild -project TTPoolAssist.xcodeproj \
            -scheme TTPoolAssist \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned ipa
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../TTPoolAssist.ipa Payload && cd ..
          ls -lh TTPoolAssist.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TTPoolAssist-ipa
          path: TTPoolAssist.ipa
