name: build-ipa

on:
  workflow_dispatch:
  push:
    paths:
      - 'App/**'
      - 'Shared/**'
      - 'BroadcastExtension/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          sw_vers
          xcodebuild -version
          echo "arch: $(uname -m)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -project TTPoolAssist.xcodeproj -list

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project TTPoolAssist.xcodeproj \
            -scheme TTPoolAssist \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          status=$?
          echo "---- xcodebuild exit: $status ----"
          echo "---- 错误摘要 ----"
          grep -E "error:|fatal error|is unsupported|not found" build.log | head -40 || true
          exit $status

      - name: Package unsigned ipa
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../TTPoolAssist.ipa Payload && cd ..
          ls -lh TTPoolAssist.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TTPoolAssist-ipa
          path: TTPoolAssist.ipa
